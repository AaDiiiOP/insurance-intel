services:
  backend:
    build: ./backend
    container_name: insurance-backend
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - chromadb
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-insurance_user}:${POSTGRES_PASSWORD:-insurance_pass}@postgres:5432/${POSTGRES_DB:-insurance_db}
      - CHROMA_HOST=chromadb
      # Internal container port, NOT the host-mapped 8101 below. Container-to-
      # container traffic inside Docker's network hits Chroma's own listening
      # port directly; the "8101:8000" mapping only applies from the host.
      - CHROMA_PORT=8000
      # Ollama's location. `:-` only falls back when the variable is fully
      # UNSET — if OLLAMA_HOST is exported in your shell (e.g. left over from
      # running docker-compose.prod.yml earlier) but empty or wrong, Compose
      # uses that instead of the default here, which is how this ends up as
      # a bare host with no http:// in front of it. Safer to force it to the
      # correct local value directly rather than rely on shell state.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Comma-separated origins the browser may call the API from. The
      # default covers local dev; a deployed instance uses
      # docker-compose.prod.yml, which sets this from PUBLIC_URL.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5183,http://localhost:3000}
    # Lets a container reach a service running on ITS OWN host machine,
    # regardless of what that host actually is (laptop or EC2 instance) —
    # needed both for local Ollama and for a same-instance EC2 setup.
    # On Docker Desktop (Mac/Windows) this hostname already resolves; on
    # Linux (including EC2) it does not by default, so this maps it to the
    # host gateway explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: insurance-frontend
    ports:
      - "5183:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # This is baked into the JS bundle the BROWSER downloads, so it must be
      # an address the browser itself can reach — never a Docker-internal
      # hostname. Set PUBLIC_API_URL in .env: localhost for a local run, the
      # EC2 instance's public IP (or a domain) for a deployed one.
      - VITE_API_URL=${PUBLIC_API_URL:-http://localhost:8100}
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: insurance-postgres
    ports:
      - "5442:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-insurance_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-insurance_pass}
      - POSTGRES_DB=${POSTGRES_DB:-insurance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: insurance-chromadb
    ports:
      - "8101:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
